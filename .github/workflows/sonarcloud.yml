name: SonarQube Cloud analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Compile and analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # full history: SonarQube Cloud needs it to attribute new code
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # All SonarQube Cloud configuration lives here — the pom stays clean.
      # Compilation is required for a meaningful Java analysis (the analyzer
      # reads the compiled classes); no tests are run. SONAR_TOKEN is picked
      # up from the environment by the scanner.
      - name: Compile and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          mvn -B -ntp compile
          org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar
          -Dsonar.organization=radixhomework
          -Dsonar.projectKey=radixhomework_gcode-ide
          -Dsonar.host.url=https://sonarcloud.io
