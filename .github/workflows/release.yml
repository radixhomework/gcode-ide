name: Windows release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-upload:
    name: Build and upload Windows binary
    runs-on: windows-latest
    permissions:
      contents: write   # create the release and upload the asset
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Same packaging flow as the README "Packaging (jpackage)" section.
      # Tests are not run — this job only ships the binary.
      - name: Build shaded jar
        shell: bash
        run: mvn -B -ntp -DskipTests package

      - name: Fetch JavaFX jmods
        shell: pwsh
        run: |
          curl.exe -sL -o target/openjfx-jmods.zip https://download2.gluonhq.com/openjfx/25/openjfx-25_windows-x64_bin-jmods.zip
          Expand-Archive -Path target/openjfx-jmods.zip -DestinationPath target -Force

      - name: Package app image with jpackage
        shell: bash
        run: |
          mkdir -p target/package
          cp target/gcode-ide-*.jar target/package/
          jpackage --type app-image --name gcode-ide \
            --input target/package --main-jar "$(basename target/package/gcode-ide-*.jar)" \
            --icon src/main/resources/assets/logo.ico \
            --module-path target/javafx-jmods-25 \
            --add-modules javafx.controls,javafx.fxml,java.logging \
            --java-options "--enable-native-access=javafx.graphics" \
            --dest dist-java

      - name: Zip app image
        shell: pwsh
        run: Compress-Archive -Path dist-java/gcode-ide -DestinationPath "gcode-ide-${env:GITHUB_REF_NAME}-windows-x64.zip"

      - name: Upload release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ZIP="gcode-ide-${TAG}-windows-x64.zip"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" "$ZIP" --clobber
