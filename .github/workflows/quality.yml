name: Build, test and quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-analyze:
    name: Build, test and analyze
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # full history: SonarQube Cloud needs it to attribute new code
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Windows runner (like the dev machine) so the TestFX view suites get a
      # real display. `verify` builds, runs the full test suite and packages
      # the shaded jar, then the scanner publishes the analysis to SonarQube
      # Cloud. All Sonar configuration lives here — the pom stays clean.
      # SONAR_TOKEN is picked up from the environment by the scanner.
      # -D args are quoted because PowerShell (the default Windows shell)
      # otherwise mangles them — Maven then sees tokens like ".host.url=…".
      - name: Build, test and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          mvn -B -ntp verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar
          "-Dsonar.organization=radixhomework"
          "-Dsonar.projectKey=radixhomework_gcode-ide"
          "-Dsonar.host.url=https://sonarcloud.io"
