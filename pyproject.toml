[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gcode-ide"
dynamic = ["version"]
description = "Desktop IDE for GRBL G-code: edit, preview, and verify toolpaths"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-qt", "ruff"]

[project.scripts]
gcode-ide = "app.main:main"

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
