schema: spec-driven

context: |
  G-Code IDE (repo gcode-ide): cross-platform desktop app (Windows/macOS/Linux)
  to author, preview, and generate GRBL G-code for any GRBL-driven desktop
  CNC mill (machine-agnostic). Machine control is out of scope -
  it lives in the sibling project grbl-machine-controller (Python/PySide6).
  Handoff between the two apps is a .nc file on disk.
  Tech stack (feat/java-design branch): Java 25 LTS, JavaFX 25, Maven build.
  Machine-profile-free by decision (change remove-machine-profiles): no bed
  envelope, feed caps, or profile selection; warnings are dialect-only.
  MVC with a pure-Java model/service layer (parsing, statistics,
  no JavaFX imports) and JavaFX views/controllers (RichTextFX CodeArea editor,
  Canvas toolpath preview). Lombok for service/controller boilerplate;
  SLF4J + Logback for logging. Tests: JUnit 5 (model/services headless) +
  TestFX (GUI smoke). Packaging via jpackage. The Python/PySide6 reference
  implementation lives on the feat/python-design branch.
  Roadmap: phase 1 IDE core (editor, parser, preview),
  phase 2 SVG import wizard, phase 3 tool library (SQLite + FreeCAD ToolBit
  import) and tool-aware generation, phase 4 text/image producers,
  phase 5 CAM niceties (fill-out, ordering, arcs, 3D preview).

